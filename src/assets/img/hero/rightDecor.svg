<svg width="300" height="320" viewBox="0 0 300 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- overlapping thin rings (top) -->
  <g stroke="#8b99b4" stroke-opacity="0.5" stroke-width="1.3" fill="none">
    <circle cx="120" cy="66" r="40"/>
    <circle cx="168" cy="86" r="28"/>
  </g>

  <!-- large thin circle -->
  <circle cx="196" cy="196" r="70" stroke="#7c8aa5" stroke-opacity="0.4" stroke-width="1.3" fill="none"/>

  <!-- concentric arcs (radar, bottom-right corner) -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.3" fill="none">
    <path d="M300,262 A38,38 0 0 0 262,300"/>
    <path d="M300,232 A68,68 0 0 0 232,300"/>
    <path d="M300,202 A98,98 0 0 0 202,300"/>
  </g>

  <!-- plus grid (3x3) -->
  <g stroke="#7c8aa5" stroke-opacity="0.5" stroke-width="1.3">
    <path d="M26,150 h9 M30.5,145.5 v9"/>
    <path d="M60,150 h9 M64.5,145.5 v9"/>
    <path d="M94,150 h9 M98.5,145.5 v9"/>
    <path d="M26,182 h9 M30.5,177.5 v9"/>
    <path d="M60,182 h9 M64.5,177.5 v9"/>
    <path d="M94,182 h9 M98.5,177.5 v9"/>
    <path d="M26,214 h9 M30.5,209.5 v9"/>
    <path d="M60,214 h9 M64.5,209.5 v9"/>
    <path d="M94,214 h9 M98.5,209.5 v9"/>
  </g>

  <!-- tiny amber marker (restrained warm accent) -->
  <circle cx="150" cy="290" r="2.4" fill="#d9a441" fill-opacity="0.6"/>
</svg>
